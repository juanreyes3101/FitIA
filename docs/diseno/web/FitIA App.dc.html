<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter+Tight:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;background:#0B0B0C;color:#F2F0EB;font-family:'Inter Tight',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}body{overflow-x:clip}a{color:#D4FF00}a:hover{color:#E1FF4D}h1,h2,h3,h4,p,ul,ol,figure{margin:0}ul,ol{padding:0;list-style:none}button,input,select{font-family:inherit}input::placeholder{color:#7A7A80}select option{background:#1A1A1D;color:#F2F0EB}@keyframes fitia-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}@keyframes fitia-in{from{opacity:0;transform:translate3d(-24px,20px,0)}to{opacity:1;transform:none}}@keyframes fitia-spin{to{transform:rotate(360deg)}}@keyframes fitia-pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes fitia-scan{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}@keyframes fitia-toast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}}</style>
</helmet>

<sc-if value="{{ sideOn }}" hint-placeholder-val="{{ false }}">
  <aside style="position:fixed;left:0;top:0;bottom:0;width:256px;z-index:30;background:#0B0B0C;border-right:1px solid #2A2A2E;display:flex;flex-direction:column;padding:24px 16px 20px;overflow-y:auto">
    <button onClick="{{ goDash }}" aria-label="FitIA, inicio" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px;border:0;background:transparent;color:#F2F0EB;cursor:pointer" style-focus="outline:2px solid #D4FF00;outline-offset:2px">
      <svg viewBox="0 0 48 36" width="36" height="27" style="display:block;color:#D4FF00"><g fill="currentColor"><rect x="2" y="12" width="6" height="24"></rect><rect x="8" y="17" width="4" height="14"></rect><rect x="40" y="12" width="6" height="24"></rect><rect x="36" y="17" width="4" height="14"></rect><path d="M43 0l1.4 3.6L48 5l-3.6 1.4L43 10l-1.4-3.6L38 5l3.6-1.4z"></path></g><path d="M12 24h5l3-8 5 16 3-10 2 2h6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"></path></svg>
      <span style="font-family:Anton,sans-serif;font-size:28px;line-height:1">FIT<span style="color:#D4FF00">IA</span></span>
    </button>
    <nav aria-label="Principal" style="margin-top:32px;display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="7">
        <sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ n.go }}" aria-current="page" style="display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;border-radius:4px;background:#D4FF00;color:#0B0B0C;font-size:15px;font-weight:700;text-align:left;cursor:pointer" style-focus="outline:2px solid #F2F0EB;outline-offset:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="{{ n.icon }}"></path></svg>{{ n.label }}</button>
        </sc-if>
        <sc-if value="{{ n.idle }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ n.go }}" style="display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:#9A9AA0;font-size:15px;font-weight:600;text-align:left;cursor:pointer;transition:background 120ms,color 120ms" style-hover="background:#1A1A1D;color:#F2F0EB" style-active="transform:translateY(2px)" style-focus="outline:2px solid #D4FF00;outline-offset:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="{{ n.icon }}"></path></svg>{{ n.label }}</button>
        </sc-if>
      </sc-for>
    </nav>
    <div style="margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:12px">
      <div style="background:#1A1A1D;border:1px solid #2A2A2E;border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:#9A9AA0">RUTINAS IA · MES</span><span style="font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 6px;border-radius:2px;background:{{ planBg }};color:{{ planFg }}">{{ planLabel }}</span></div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;line-height:1">{{ cupo }}<span style="font-size:15px;color:#9A9AA0;font-weight:400"> / {{ cupoMax }} disponibles</span></div>
        <div style="display:flex;gap:3px"><sc-for list="{{ cupoSegs }}" as="c" hint-placeholder-count="2"><div style="flex:1;height:6px;background:{{ c.bg }}"></div></sc-for></div>
        <sc-if value="{{ isFree }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ goPlanes }}" style="min-height:44px;border:2px solid #D4FF00;border-radius:4px;background:transparent;color:#D4FF00;font-size:14px;font-weight:600;cursor:pointer" style-hover="background:#D4FF00;color:#0B0B0C" style-active="transform:translateY(2px)" style-focus="outline:2px solid #F2F0EB;outline-offset:2px">Pásate a Pro · 10 al mes</button>
        </sc-if>
      </div>
      <button onClick="{{ goPerfil }}" style="display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 8px;border:0;border-radius:4px;background:transparent;color:#F2F0EB;text-align:left;cursor:pointer" style-hover="background:#1A1A1D" style-focus="outline:2px solid #D4FF00;outline-offset:2px">
        <span style="width:40px;height:40px;flex:none;border-radius:2px;background:#F2F0EB;color:#0B0B0C;font-family:Anton,sans-serif;font-size:18px;display:flex;align-items:center;justify-content:center">{{ user.iniciales }}</span>
        <span style="min-width:0"><span style="display:block;font-weight:600;font-size:15px">{{ user.nombre }} {{ user.apellido }}</span><span style="display:block;font-size:13px;color:#9A9AA0">{{ user.gym }}</span></span>
      </button>
    </div>
  </aside>
</sc-if>

<sc-if value="{{ topOn }}" hint-placeholder-val="{{ false }}">
  <header style="position:fixed;left:0;right:0;top:0;z-index:30;height:60px;padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(11,11,12,.94);border-bottom:1px solid #2A2A2E;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)">
    <button onClick="{{ goDash }}" aria-label="FitIA, inicio" style="display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;color:#F2F0EB;padding:0;cursor:pointer">
      <svg viewBox="0 0 48 36" width="30" height="23" style="display:block;color:#D4FF00"><g fill="currentColor"><rect x="2" y="12" width="6" height="24"></rect><rect x="8" y="17" width="4" height="14"></rect><rect x="40" y="12" width="6" height="24"></rect><rect x="36" y="17" width="4" height="14"></rect><path d="M43 0l1.4 3.6L48 5l-3.6 1.4L43 10l-1.4-3.6L38 5l3.6-1.4z"></path></g><path d="M12 24h5l3-8 5 16 3-10 2 2h6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"></path></svg>
      <span style="font-family:Anton,sans-serif;font-size:24px;line-height:1">FIT<span style="color:#D4FF00">IA</span></span>
    </button>
    <div style="display:flex;align-items:center;gap:4px">
      <button onClick="{{ goLumbar }}" aria-label="Zona lumbar" style="width:44px;height:44px;border:0;border-radius:4px;background:{{ lumbarBg }};color:{{ lumbarFg }};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"></path></svg></button>
      <button onClick="{{ goPlanes }}" aria-label="Planes" style="width:44px;height:44px;border:0;border-radius:4px;background:{{ planesBg }};color:{{ planesFg }};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 7h18v12H3zM3 11h18M7 15h4"></path></svg></button>
    </div>
  </header>
  <nav aria-label="Principal" style="position:fixed;left:0;right:0;bottom:0;z-index:30;height:72px;display:flex;align-items:stretch;background:#1A1A1D;border-top:1px solid #2A2A2E;padding:0 4px">
    <sc-for list="{{ tabsL }}" as="t" hint-placeholder-count="2">
      <button onClick="{{ t.go }}" aria-current="{{ t.cur }}" style="flex:1;border:0;background:transparent;color:{{ t.fg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:inset 0 3px 0 {{ t.line }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="{{ t.icon }}"></path></svg>{{ t.label }}</button>
    </sc-for>
    <div style="flex:1;display:flex;align-items:center;justify-content:center">
      <button onClick="{{ goEntreno }}" aria-label="Entrenar" style="width:60px;height:60px;margin-top:-28px;border:0;border-radius:4px;background:#D4FF00;color:#0B0B0C;display:flex;align-items:center;justify-content:center;cursor:pointer;transform:rotate(-7deg);box-shadow:0 4px 0 #7E9900;transition:transform 90ms,box-shadow 90ms" style-active="transform:rotate(-7deg) translateY(2px);box-shadow:0 2px 0 #7E9900"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></button>
    </div>
    <sc-for list="{{ tabsR }}" as="t" hint-placeholder-count="2">
      <button onClick="{{ t.go }}" aria-current="{{ t.cur }}" style="flex:1;border:0;background:transparent;color:{{ t.fg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:inset 0 3px 0 {{ t.line }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="{{ t.icon }}"></path></svg>{{ t.label }}</button>
    </sc-for>
  </nav>
</sc-if>

<sc-if value="{{ isFull }}" hint-placeholder-val="{{ false }}">
  <sc-if value="{{ r.onboarding }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppOnboarding" app="{{ app }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ r.entreno }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppEntreno" app="{{ app }}" hint-size="100%,100vh"></dc-import></sc-if>
</sc-if>

<sc-if value="{{ isChrome }}" hint-placeholder-val="{{ true }}">
  <main style="margin-left:{{ mainMl }};padding:{{ mainPad }};min-height:100vh">
    <div style="max-width:1180px;margin:0 auto">
      <sc-if value="{{ r.dashboard }}" hint-placeholder-val="{{ true }}"><dc-import name="FitiaAppDashboard" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.rutina }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppRutina" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.ejercicio }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppEjercicio" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.progreso }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppProgreso" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.lumbar }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppLumbar" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.planes }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppPlanes" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
      <sc-if value="{{ r.perfil }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaAppPerfil" app="{{ app }}" hint-size="100%,900px"></dc-import></sc-if>
    </div>
  </main>
</sc-if>

<div aria-live="polite" style="position:fixed;right:{{ toastRight }};left:{{ toastLeft }};bottom:{{ toastBottom }};z-index:60;display:flex;flex-direction:column;gap:8px;width:{{ toastW }};pointer-events:none">
  <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="0">
    <div role="status" style="pointer-events:auto;display:flex;align-items:stretch;background:#1A1A1D;border:1px solid #2A2A2E;border-radius:4px;overflow:hidden;box-shadow:0 24px 48px -12px rgba(0,0,0,.9);animation:fitia-toast 240ms cubic-bezier(.2,.8,.2,1)">
      <div style="width:52px;flex:none;background:{{ t.bg }};display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="square"><path d="{{ t.d }}"></path></svg></div>
      <div style="flex:1;padding:12px 14px;min-width:0"><div style="font-weight:700">{{ t.title }}</div><div style="font-size:14px;color:#9A9AA0">{{ t.msg }}</div></div>
      <button onClick="{{ t.close }}" aria-label="Cerrar aviso" style="width:44px;flex:none;border:0;background:transparent;color:#9A9AA0;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="color:#F2F0EB"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;estadoDemo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;carga&quot;,&quot;vacio&quot;,&quot;error&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;plan&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;free&quot;,&quot;pro&quot;],&quot;default&quot;:&quot;free&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;}}">
const IC = {
  inicio: 'M3 11l9-7 9 7v10H3zM10 21v-6h4v6',
  rutina: 'M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12',
  entreno: 'M13 2L4 14h7l-1 8 9-12h-7z',
  progreso: 'M3 20h18M4 16l5-5 4 3 7-7M15 7h5v5',
  lumbar: 'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',
  planes: 'M3 7h18v12H3zM3 11h18M7 15h4',
  perfil: 'M8 4h8v8H8zM4 21l2-5h12l2 5'
};
const NAV = [['dashboard', 'Inicio', IC.inicio], ['rutina', 'Mi rutina', IC.rutina], ['entreno', 'Entrenar', IC.entreno], ['progreso', 'Progreso', IC.progreso], ['lumbar', 'Zona lumbar', IC.lumbar], ['planes', 'Planes', IC.planes], ['perfil', 'Perfil', IC.perfil]];
const ROUTES = ['onboarding', 'dashboard', 'rutina', 'ejercicio', 'entreno', 'progreso', 'lumbar', 'planes', 'perfil'];
const E = (nombre, tipo, nivel, dosis, descanso, segura, equipo, p, s, pasos, errores, porque) => ({ nombre, tipo, nivel, dosis, descanso, segura, equipo, musculos: { p, s }, pasos, errores, porque });
const EJ = {
  banda: E('Caminata en banda inclinada', 'Cardio', 'Principiante', '15 min', '—', true, 'Banda', ['Glúteos', 'Cuádriceps'], ['Pantorrillas', 'Core'], ['Sube la inclinación a 4–6 % y camina a un ritmo en el que puedas hablar.', 'Mantén el tronco erguido y no te agarres de las barandas.', 'Da pasos cortos y apoya primero el talón.'], ['Colgarse de las barandas: carga la espalda baja.', 'Inclinar el tronco hacia adelante.'], 'Es cardio de bajo impacto: quemas calorías para bajar de peso sin el golpe que el trote le da a tu zona lumbar.'),
  bici: E('Bicicleta estática', 'Cardio', 'Principiante', '10 min', '—', true, 'Bicicleta', ['Cuádriceps', 'Glúteos'], ['Isquiotibiales'], ['Ajusta el sillín a la altura de tu cadera.', 'Pedalea con resistencia media y la espalda recta.', 'Mantén una cadencia constante.'], ['Sillín muy bajo: dobla la espalda y carga las rodillas.', 'Encorvarte sobre el manubrio.'], 'Sube tus pulsaciones sentada y con apoyo, sin impacto para la espalda.'),
  plancha: E('Plancha en rodillas', 'Core', 'Principiante', '3 × 20 s', '40 s', true, 'Colchoneta', ['Abdomen', 'Transverso'], ['Hombros', 'Glúteos'], ['Apoya antebrazos y rodillas en la colchoneta.', 'Alinea cabeza, espalda y cadera.', 'Aprieta abdomen y glúteos, y respira sin soltar.'], ['Hundir la cadera: arquea la zona lumbar.', 'Aguantar la respiración.'], 'Fortalece el core que protege tu columna. En rodillas, la carga es justa para tu nivel.'),
  perro: E('Perro de caza', 'Core', 'Principiante', '3 × 10 / lado', '45 s', true, 'Colchoneta', ['Core', 'Glúteos'], ['Espalda baja', 'Hombros'], ['En cuatro apoyos: manos bajo hombros, rodillas bajo cadera.', 'Estira brazo derecho y pierna izquierda a la vez.', 'Sostén 2 segundos y cambia de lado.'], ['Girar la cadera al levantar la pierna.', 'Subir la pierna más alto que la cadera.'], 'Entrena la estabilidad de tu espalda baja sin comprimirla. Es de los más recomendados para molestia lumbar.'),
  bicho: E('Bicho muerto', 'Core', 'Principiante', '3 × 10', '45 s', true, 'Colchoneta', ['Abdomen'], ['Flexores de cadera'], ['Boca arriba, brazos al techo y rodillas a 90°.', 'Baja brazo y pierna contrarios sin despegar la espalda del suelo.', 'Vuelve al centro y cambia de lado.'], ['Despegar la zona lumbar del suelo.', 'Hacerlo rápido.'], 'Trabaja el abdomen con la espalda apoyada: no hay forma de arquearla.'),
  sentadilla: E('Sentadilla a cajón', 'Fuerza', 'Principiante', '3 × 12', '60 s', true, 'Cajón o banco', ['Cuádriceps', 'Glúteos'], ['Core', 'Isquiotibiales'], ['Párate frente al cajón, pies al ancho de hombros.', 'Baja llevando la cadera atrás hasta rozar el cajón.', 'Empuja con los talones para subir.'], ['Rodillas hacia adentro.', 'Dejarte caer sobre el cajón.'], 'El cajón marca la profundidad: bajas segura y sin curvar la espalda. Ideal para quemar calorías ganando fuerza.'),
  puente: E('Puente de glúteo', 'Fuerza', 'Principiante', '3 × 15', '45 s', true, 'Colchoneta', ['Glúteos'], ['Isquiotibiales', 'Core'], ['Boca arriba, rodillas dobladas y pies apoyados.', 'Aprieta glúteos y sube la cadera hasta alinear rodillas, cadera y hombros.', 'Sostén 2 segundos y baja lento.'], ['Subir de más y arquear la espalda.', 'Empujar con la punta de los pies.'], 'Glúteos fuertes le quitan trabajo a tu espalda baja. Es clave para tu molestia lumbar.'),
  prensa: E('Prensa de piernas', 'Fuerza', 'Principiante', '3 × 12', '60 s', true, 'Máquina de prensa', ['Cuádriceps', 'Glúteos'], ['Isquiotibiales'], ['Siéntate con la espalda completamente apoyada.', 'Pies al ancho de hombros en la plataforma.', 'Baja hasta 90° de rodilla y empuja sin bloquear.'], ['Despegar la cadera del asiento.', 'Bajar demasiado: la pelvis se curva.'], 'Fuerza de pierna con la espalda apoyada: la máquina te sostiene mientras ganas fuerza.'),
  zancada: E('Zancada estática con apoyo', 'Fuerza', 'Intermedio', '3 × 10 / lado', '60 s', false, 'Pared o barra', ['Cuádriceps', 'Glúteos'], ['Core'], ['Da un paso largo y apóyate con una mano en la pared.', 'Baja la rodilla de atrás hacia el piso.', 'Sube empujando con la pierna de adelante.'], ['Inclinar el tronco hacia adelante.', 'Rodilla de adelante pasando la punta del pie.'], 'Trabaja cada pierna por separado. Mantén el tronco recto; si te molesta la espalda, cámbialo por puente de glúteo.'),
  talones: E('Elevación de talones', 'Fuerza', 'Principiante', '3 × 15', '30 s', true, 'Escalón', ['Pantorrillas'], ['Tobillos'], ['Párate en el borde de un escalón, con apoyo.', 'Sube en puntas lo más alto que puedas.', 'Baja lento por debajo del escalón.'], ['Rebotar.', 'Doblar las rodillas.'], 'Cierra la sesión de pierna sin carga sobre la columna.'),
  gato: E('Gato-camello', 'Movilidad', 'Principiante', '2 × 10', '30 s', true, 'Colchoneta', ['Columna'], ['Core'], ['En cuatro apoyos, espalda neutra.', 'Exhala y redondea la espalda hacia el techo.', 'Inhala y hunde suave el abdomen, mirando al frente.'], ['Forzar el rango.', 'Moverte rápido.'], 'Mueve tu columna vértebra por vértebra y alivia la rigidez lumbar.'),
