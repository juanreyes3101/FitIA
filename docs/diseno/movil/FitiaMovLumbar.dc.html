<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-screen-label="Lumbar" style="padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px;animation:fitia-in 350ms cubic-bezier(.2,.8,.2,1)">
  <header><div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.06em;color:#3DDC84">MOLESTIA LUMBAR · MODERADA</div><h1 style="margin-top:4px;font-family:Anton,sans-serif;font-weight:400;font-size:44px;line-height:.92;text-transform:uppercase">Cuida tu espalda</h1></header>

  <article style="position:relative;overflow:hidden;border-radius:4px;background:#1A1A1D;border:2px solid #3DDC84;padding:18px;display:flex;flex-direction:column;gap:14px">
    <div aria-hidden="true" style="position:absolute;right:-10px;top:-30px;font-family:Anton,sans-serif;font-size:170px;line-height:1;color:rgba(61,220,132,.1)">10</div>
    <span style="position:relative;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 8px;border-radius:2px;background:#3DDC84;color:#0B0B0C">RUTINA RÁPIDA</span>
    <h2 style="position:relative;font-family:Anton,sans-serif;font-weight:400;font-size:44px;line-height:.88;text-transform:uppercase">10 minutos<br>para tu espalda</h2>
    <ol style="position:relative;display:flex;flex-direction:column">
      <sc-for list="{{ rapida }}" as="x" hint-placeholder-count="5"><li style="display:flex;align-items:center;gap:12px;min-height:44px;border-top:1px solid #2A2A2E"><span style="font-family:Anton,sans-serif;font-size:20px;color:#3DDC84;width:28px">{{ x.num }}</span><span style="flex:1;font-weight:600">{{ x.nombre }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#9A9AA0">{{ x.t }}</span></li></sc-for>
    </ol>
    <button onClick="{{ empezar }}" style="position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:0;border-radius:4px;background:#3DDC84;color:#0B0B0C;font-family:Anton,sans-serif;font-size:28px;cursor:pointer;box-shadow:0 5px 0 #1F7A47" style-active="transform:translateY(3px);box-shadow:0 2px 0 #1F7A47"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"></path></svg>EMPEZAR · 10 MIN</button>
  </article>

  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><h2 style="font-family:Anton,sans-serif;font-weight:400;font-size:28px;text-transform:uppercase">Biblioteca</h2><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#9A9AA0">{{ countTxt }}</span></div>
  <div style="display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px">
    <sc-for list="{{ tipos }}" as="t" hint-placeholder-count="5"><button onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="flex:none;min-height:48px;padding:0 16px;border:2px solid {{ t.bd }};border-radius:2px;background:{{ t.bg }};color:{{ t.fg }};font-size:15px;font-weight:700;cursor:pointer" style-active="transform:translateY(2px)">{{ t.l }}</button></sc-for>
  </div>
  <button role="switch" aria-checked="{{ solo }}" onClick="{{ toggleSolo }}" style="display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 14px;border:1px solid #2A2A2E;border-radius:4px;background:#1A1A1D;color:#F2F0EB;font-size:16px;font-weight:600;cursor:pointer">Solo seguros para mí<span style="width:52px;height:30px;border-radius:2px;background:{{ swBg }};position:relative;transition:background 150ms"><span style="position:absolute;top:4px;left:{{ swL }};width:22px;height:22px;background:{{ swK }};transition:left 150ms"></span></span></button>

  <div style="display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ items }}" as="e" hint-placeholder-count="6">
      <button onClick="{{ e.go }}" style="display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #2A2A2E;border-radius:4px;background:#1A1A1D;color:#F2F0EB;text-align:left;cursor:pointer" style-active="transform:translateY(2px)">
        <span style="position:relative;width:64px;height:64px;flex:none;border-radius:2px;overflow:hidden;isolation:isolate;background:#2A2A2E"><span style="position:absolute;inset:0;filter:grayscale(1) contrast(1.35)"><image-slot id="mov-lib-{{ e.id }}" shape="rect" placeholder="{{ e.tipo }}"></image-slot></span><span style="position:absolute;inset:0;background:#D4FF00;mix-blend-mode:multiply;pointer-events:none"></span></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:17px;font-weight:700;line-height:1.2">{{ e.nombre }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#9A9AA0">{{ e.dosis }} · {{ e.tipo }}</span><span style="font-size:12px;font-weight:700;color:{{ e.sc }}">{{ e.sello }}</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2" stroke-linecap="square"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TIPOS = ['Todos', 'Movilidad', 'Core', 'Fuerza', 'Cardio'];
class Component extends DCLogic {
  state = { tipo: 'Todos', solo: false };
  renderVals() {
    const a = this.props.app || {}; const s = this.state; const ej = a.ej || {}; const all = Object.values(ej);
    const list = all.filter(e => (s.tipo === 'Todos' || e.tipo === s.tipo) && (!s.solo || e.segura));
    const R = [['gato', '1:30'], ['perro', '2:30'], ['rotacion', '2:00'], ['rodilla', '1:30'], ['nino', '2:30']];
    return {
      rapida: R.map(([id, t], i) => ({ nombre: (ej[id] || {}).nombre, t, num: '0' + (i + 1) })),
      empezar: () => { location.hash = '#/entreno?lumbar=1' + ((a.q || {}).os ? '&os=' + a.q.os : ''); },
      countTxt: `${list.length} DE ${all.length}`,
      tipos: TIPOS.map(l => ({ l, on: s.tipo === l, bg: s.tipo === l ? '#D4FF00' : 'transparent', fg: s.tipo === l ? '#0B0B0C' : '#F2F0EB', bd: s.tipo === l ? '#D4FF00' : '#2A2A2E', pick: () => this.setState({ tipo: l }) })),
      solo: s.solo, toggleSolo: () => this.setState({ solo: !s.solo }), swBg: s.solo ? '#3DDC84' : '#2A2A2E', swL: s.solo ? '26px' : '4px', swK: s.solo ? '#0B0B0C' : '#9A9AA0',
      items: list.map(e => ({ ...e, sello: e.segura ? '✓ SEGURO PARA TU ESPALDA' : 'SOLO CON MOLESTIA LEVE', sc: e.segura ? '#3DDC84' : '#FFB020', go: () => a.go('ejercicio', e.id) }))
    };
  }
}
</script>
</body>
</html>
