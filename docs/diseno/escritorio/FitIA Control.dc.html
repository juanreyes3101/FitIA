<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter+Tight:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="./fitia-data.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0B0B0C;color:#F2F0EB;font-family:'Inter Tight',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}a{color:#D4FF00}a:hover{color:#E1FF4D}h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}button,input,select,textarea{font-family:inherit;font-size:inherit}input::placeholder,textarea::placeholder{color:#7A7A80}select option{background:#1A1A1D;color:#F2F0EB}table{border-collapse:collapse;width:100%}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2A2A2E}::-webkit-scrollbar-track{background:transparent}@keyframes fitia-pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes fitia-in{from{opacity:0;transform:translate3d(-16px,12px,0)}to{opacity:1;transform:none}}@keyframes fitia-spin{to{transform:rotate(360deg)}}@keyframes fitia-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}@keyframes fitia-slide{from{transform:translateX(100%)}to{transform:none}}@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}}</style>
</helmet>

<div style="height:100vh;display:flex;flex-direction:column;background:#0B0B0C">
  <div style="height:32px;flex:none;display:flex;align-items:center;background:#141416;border-bottom:1px solid #2A2A2E;user-select:none">
    <div style="display:flex;align-items:center;gap:8px;padding:0 12px;flex:1;min-width:0">
      <svg viewBox="0 0 48 36" width="18" height="14" style="color:#D4FF00;flex:none"><g fill="currentColor"><rect x="2" y="12" width="6" height="24"></rect><rect x="8" y="17" width="4" height="14"></rect><rect x="40" y="12" width="6" height="24"></rect><rect x="36" y="17" width="4" height="14"></rect><path d="M43 0l1.4 3.6L48 5l-3.6 1.4L43 10l-1.4-3.6L38 5l3.6-1.4z"></path></g><path d="M12 24h5l3-8 5 16 3-10 2 2h6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"></path></svg>
      <span style="font-size:12px;color:#C8C8CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">FitIA Control — {{ winTitle }}</span>
    </div>
    <div style="display:flex;height:100%">
      <span aria-hidden="true" style="width:46px;display:flex;align-items:center;justify-content:center;color:#C8C8CC" style-hover="background:#2A2A2E"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"></path></svg></span>
      <span aria-hidden="true" style="width:46px;display:flex;align-items:center;justify-content:center;color:#C8C8CC" style-hover="background:#2A2A2E"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x=".5" y=".5" width="9" height="9" stroke="currentColor"></rect></svg></span>
      <span aria-hidden="true" style="width:46px;display:flex;align-items:center;justify-content:center;color:#C8C8CC" style-hover="background:#E81123;color:#FFFFFF"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></span>
    </div>
  </div>

  <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;min-height:0"><dc-import name="FitiaCtlLogin" ctl="{{ ctl }}" hint-size="100%,100%"></dc-import></div>
  </sc-if>

  <sc-if value="{{ isApp }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;min-height:0;display:flex">
      <aside style="width:{{ sideW }};flex:none;display:flex;flex-direction:column;background:#0B0B0C;border-right:1px solid #2A2A2E;padding:14px 10px 12px;overflow-y:auto;transition:width 200ms">
        <div style="display:flex;align-items:center;gap:10px;padding:2px 8px 16px">
          <span style="font-family:Anton,sans-serif;font-size:22px;line-height:1">FIT<span style="color:#D4FF00">IA</span></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 5px;border:1px solid #D4FF00;color:#D4FF00;border-radius:2px">CONTROL</span>
        </div>
        <nav aria-label="Principal" style="display:flex;flex-direction:column;gap:2px">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="8">
            <button onClick="{{ n.go }}" aria-current="{{ n.cur }}" title="{{ n.label }}" style="position:relative;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:4px;background:{{ n.bg }};color:{{ n.fg }};font-size:14px;font-weight:{{ n.fw }};text-align:left;cursor:pointer;transition:background 120ms" style-hover="background:#1A1A1D;color:#F2F0EB" style-focus="outline:2px solid #D4FF00;outline-offset:-2px">
              <span style="position:absolute;left:0;top:8px;bottom:8px;width:3px;background:{{ n.bar }}"></span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex:none"><path d="{{ n.icon }}"></path></svg>
              <span style="flex:1;white-space:nowrap">{{ n.label }}</span>
              <sc-if value="{{ n.live }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;background:{{ n.liveC }};animation:fitia-pulse 1.4s infinite"></span></sc-if>
            </button>
          </sc-for>
        </nav>
        <div style="margin-top:auto;padding:12px 8px 0;border-top:1px solid #2A2A2E;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;flex:none;border-radius:2px;background:#F2F0EB;color:#0B0B0C;font-family:Anton,sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center">SC</span><span style="min-width:0"><span style="display:block;font-size:13px;font-weight:600">Santiago Castañeda</span><span style="display:block;font-size:12px;color:#9A9AA0">Administrador</span></span></div>
          <button onClick="{{ logout }}" style="min-height:36px;border:1px solid #2A2A2E;border-radius:4px;background:transparent;color:#9A9AA0;font-size:13px;font-weight:600;cursor:pointer" style-hover="color:#F2F0EB;border-color:#F2F0EB">Cerrar sesión</button>
        </div>
      </aside>

      <div style="flex:1;min-width:0;display:flex;flex-direction:column">
        <header style="height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #2A2A2E;background:#0B0B0C">
          <button onClick="{{ goMon }}" style="display:inline-flex;align-items:center;gap:10px;min-height:34px;padding:0 12px;border:1px solid {{ stBd }};border-radius:4px;background:{{ stBg }};color:{{ stFg }};font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none" style-focus="outline:2px solid #F2F0EB;outline-offset:2px">
            <span style="position:relative;width:10px;height:10px;flex:none"><span style="position:absolute;inset:0;border-radius:50%;background:{{ stDot }}"></span><span style="position:absolute;inset:0;border-radius:50%;background:{{ stDot }};animation:fitia-ping 1.6s infinite"></span></span>{{ stTxt }}
          </button>
          <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#9A9AA0;white-space:nowrap">IA: <span style="color:#F2F0EB">{{ provider }}</span> · API {{ apiRep }} réplicas · p95 {{ apiP95 }} ms</span>
          <span style="flex:1"></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;white-space:nowrap">{{ clock }}</span>
          <span style="font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 7px;border-radius:2px;border:1px solid #FFB020;color:#FFB020;white-space:nowrap">DATOS SIMULADOS</span>
        </header>
        <main style="flex:1;min-height:0;overflow:auto;padding:{{ mainPad }}">
          <sc-if value="{{ r.resumen }}" hint-placeholder-val="{{ true }}"><dc-import name="FitiaCtlResumen" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
          <sc-if value="{{ r.usuarios }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaCtlUsuarios" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
          <sc-if value="{{ r.entrenadores }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaCtlEntrenadores" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
          <sc-if value="{{ r.ejercicios }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaCtlEjercicios" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
          <sc-if value="{{ r.planes }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaCtlPlanes" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
          <sc-if value="{{ r.reportes }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaCtlReportes" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
          <sc-if value="{{ r.monitoreo }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaCtlMonitoreo" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
          <sc-if value="{{ r.config }}" hint-placeholder-val="{{ false }}"><dc-import name="FitiaCtlConfig" ctl="{{ ctl }}" hint-size="100%,640px"></dc-import></sc-if>
        </main>
      </div>
    </div>
  </sc-if>
</div>

<div aria-live="polite" style="position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px;width:360px;pointer-events:none">
  <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="0">
    <div role="status" style="pointer-events:auto;display:flex;align-items:stretch;background:#1A1A1D;border:1px solid #2A2A2E;border-radius:4px;overflow:hidden;box-shadow:0 24px 48px -12px rgba(0,0,0,.9);animation:fitia-in 220ms cubic-bezier(.2,.8,.2,1)">
      <div style="width:44px;flex:none;background:{{ t.bg }};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2.5" stroke-linecap="square"><path d="{{ t.d }}"></path></svg></div>
      <div style="flex:1;padding:10px 12px;min-width:0"><div style="font-weight:700">{{ t.title }}</div><div style="font-size:13px;color:#9A9AA0">{{ t.msg }}</div></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1366,&quot;height&quot;:768}}">
const IC = {
  resumen: 'M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z',
  usuarios: 'M9 4h6v6H9zM4 21l2-7h12l2 7',
  entrenadores: 'M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12',
  ejercicios: 'M4 4h16v16H4zM4 10h16M10 4v16',
  planes: 'M3 7h18v12H3zM3 11h18M7 15h4',
  reportes: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  monitoreo: 'M2 12h4l3-8 4 16 3-8h6',
  config: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2'
};
const NAV = [['resumen', 'Resumen'], ['usuarios', 'Usuarios'], ['entrenadores', 'Entrenadores'], ['ejercicios', 'Ejercicios'], ['planes', 'Planes y anuncios'], ['reportes', 'Reportes'], ['monitoreo', 'Monitoreo'], ['config', 'Configuración']];
const ROUTES = ['login', ...NAV.map(n => n[0])];
const TITLES = { login: 'Ingreso', resumen: 'Resumen', usuarios: 'Usuarios', entrenadores: 'Entrenadores', ejercicios: 'Ejercicios y contraindicaciones', planes: 'Planes y anuncios', reportes: 'Reportes', monitoreo: 'Monitoreo', config: 'Configuración' };
const TOAST = { ok: ['#3DDC84', 'M4 12l5 5L20 6'], warn: ['#FFB020', 'M12 3l10 18H2zM12 10v5M12 18v1'], err: ['#FF3B3B', 'M6 6l12 12M18 6L6 18'], ia: ['#D4FF00', 'M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z'], sig: ['#FF4D1A', 'M2 12h4l3-8 4 16 3-8h6'] };
const N = 90;
const rnd = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
const BASE_T = 10 * 3600 + 42 * 60;
const clk = t => { const s = BASE_T + t; return [Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':'); };
const meanSd = a => { const m = a.reduce((x, y) => x + y, 0) / (a.length || 1); const v = a.reduce((x, y) => x + (y - m) * (y - m), 0) / (a.length || 1); return [m, Math.sqrt(v)]; };
const DEF_CFG = { provider: 'Gemini', z: 3, ventana: 60, consec: 3, cooldown: 10, scaleIn: true, calma: 25, pol: { api: [2, 5], ia: [1, 3], db: [1, 2], web: [2, 4] }, autoRemediar: true };

function sample(st, cfg) {
  const ramp = st.spike > 0 ? Math.min(1, (36 - st.spike) / 4) : 0;
  const rps = 96 + 8 * rnd() + ramp * 95;
  const per = rps / st.rep.api;
  const lat = Math.max(70, 108 + 7 * rnd() + Math.max(0, per - 56) * 2.3);
  const err = Math.max(0.05, 0.32 + 0.07 * rnd() + Math.max(0, per - 66) * 0.085);
  const cpu = Math.min(98, 22 + per * 0.52 + 2.5 * rnd());
  const mem = 54 + st.rep.api * 2.5 + 1.5 * rnd() + ramp * 6;
  return { rps, lat, err, cpu, mem };
}

class Component extends DCLogic {
  constructor(p) {
    super(p);
    const cfg = { ...DEF_CFG, pol: { ...DEF_CFG.pol } };
    const st = { t: 0, spike: 0, rep: { api: 2, ia: 1, db: 1, web: 2 } };
    const lat = [], err = [], rps = [], cpu = [], mem = [], base = [], ebase = [];
    for (let i = 0; i < N; i++) { const s = sample(st, cfg); lat.push({ v: s.lat, a: false }); err.push(s.err); rps.push(s.rps); cpu.push(s.cpu); mem.push(s.mem); base.push(s.lat); ebase.push(s.err); }
    this.state = {
      route: 'resumen', authed: true, toasts: [], cfg,
      mon: { t: 0, spike: 0, rep: st.rep, lat, err, rps, cpu, mem, base, ebase, lc: 0, ec: 0, ok: 0, calm: 0, latOpen: false, errOpen: false, inc: null, lastInc: null, z: 0, ze: 0, mean: 108, sd: 7,
        log: [
          { id: 3, hora: '09:58:12', svc: 'IA', det: 'Latencia IA 4,1σ (proveedor lento)', acc: 'Cambio a proveedor Mock por 120 s', res: 'Verificado ✓', dur: '2 min 04 s', tipo: 'fallback' },
          { id: 2, hora: '08:31:40', svc: 'API', det: 'Latencia API 3,4σ sobre la línea base', acc: 'Escalado de 2 a 3 réplicas', res: 'Verificado ✓', dur: '38 s', tipo: 'scale-out' },
          { id: 1, hora: '08:44:05', svc: 'API', det: 'Carga baja sostenida (25 s)', acc: 'Escalado de 3 a 2 réplicas', res: 'Verificado ✓', dur: '6 s', tipo: 'scale-in' }
        ] }
    };
  }
  componentDidMount() {
    this.onHash = () => { const h = (location.hash || '').replace(/^#\/?/, '').split('?')[0]; const r = ROUTES.includes(h) ? h : 'resumen'; this.setState({ route: r }); if ((location.hash || '').includes('pico=1')) setTimeout(() => this.simulate(), 800); };
    window.addEventListener('hashchange', this.onHash); this.onHash();
    window.__fitiaCtlInst = this;
    if (!window.__fitiaCtlTimer) window.__fitiaCtlTimer = setInterval(() => { const i = window.__fitiaCtlInst; if (i && i.tick) { try { i.tick(); } catch (e) {} } }, 1000);
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }
  go = r => { location.hash = '#/' + r; };
  toast = (tipo, title, msg) => { const id = Date.now() + Math.random(); const [bg, d] = TOAST[tipo] || TOAST.ok; this.setState(s => ({ toasts: [...s.toasts.slice(-2), { id, bg, d, title, msg }] })); setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(x => x.id !== id) })), 4200); };
  simulate = () => { if (this.state.mon.spike > 0) return; this.setState(s => ({ mon: { ...s.mon, spike: 36 } })); this.toast('sig', 'Pico de tráfico simulado', '≈ +95 peticiones/s durante 36 s'); };
  tick() {
    const cfg = this.state.cfg; const m = { ...this.state.mon, rep: { ...this.state.mon.rep } };
    m.t += 1; if (m.spike > 0) m.spike -= 1;
    const s = sample(m, cfg); const hora = clk(m.t);
    const win = m.base.slice(-cfg.ventana); const [mean, sd0] = meanSd(win); const sd = Math.max(4, sd0);
    const ewin = m.ebase.slice(-cfg.ventana); const [em, esd0] = meanSd(ewin); const esd = Math.max(0.06, esd0);
    const z = (s.lat - mean) / sd, ze = (s.err - em) / esd;
    m.lc = z > cfg.z ? m.lc + 1 : 0; m.ec = ze > cfg.z ? m.ec + 1 : 0;
    const anom = z > cfg.z;
    if (!anom && !m.inc) m.base = [...m.base.slice(-200), s.lat];
    if (ze <= cfg.z && !m.inc) m.ebase = [...m.ebase.slice(-200), s.err];
    m.lat = [...m.lat.slice(1), { v: s.lat, a: anom }]; m.err = [...m.err.slice(1), s.err]; m.rps = [...m.rps.slice(1), s.rps]; m.cpu = [...m.cpu.slice(1), s.cpu]; m.mem = [...m.mem.slice(1), s.mem];
    m.z = z; m.ze = ze; m.mean = mean; m.sd = sd;
    const fmt = (n, d = 1) => n.toFixed(d).replace('.', ',');
    const [mn, mx] = cfg.pol.api;
    if (!m.latOpen && m.lc >= cfg.consec) {
      m.latOpen = true;
      m.inc = { id: Date.now(), start: m.t, hora, from: m.rep.api, to: m.rep.api, execAt: null, steps: [
        { f: 'Monitor', h: hora, txt: `p95 API ${Math.round(s.lat)} ms en ${cfg.consec} muestras seguidas`, ok: true },
        { f: 'Analizar', h: clk(m.t), txt: `Latencia API ${fmt(z)}σ sobre la línea base (${Math.round(mean)} ± ${Math.round(3 * sd)} ms)`, ok: true }
      ] };
      this.toast('sig', 'Anomalía detectada', `Latencia API ${fmt(z)}σ sobre la línea base`);
    }
    if (m.ec >= cfg.consec && !m.errOpen) m.errOpen = true;
    if (m.errOpen && ze <= cfg.z) m.errOpen = false;
    const inc = m.inc;
    if (inc) {
      const el = m.t - inc.start;
      if (el === 1 && !inc.steps.find(x => x.f === 'Planificar')) inc.steps.push({ f: 'Planificar', h: hora, txt: cfg.autoRemediar ? (m.rep.api < mx ? `Escalar API de ${m.rep.api} a ${m.rep.api + 1} réplicas (máx. ${mx})` : `Réplicas al máximo (${mx}): alertar al administrador`) : 'Remediación automática apagada: solo alertar', ok: true });
      if (el === 3 && cfg.autoRemediar && m.rep.api < mx) { m.rep.api += 1; inc.to = m.rep.api; inc.execAt = m.t; inc.steps.push({ f: 'Ejecutar', h: hora, txt: `Réplica api-${m.rep.api} levantada · balanceador actualizado`, ok: true }); this.toast('ia', 'Remediación ejecutada', `API escalada a ${m.rep.api} réplicas`); }
      if (inc.execAt && m.t - inc.execAt === cfg.cooldown && z > cfg.z && m.rep.api < mx) { m.rep.api += 1; inc.to = m.rep.api; inc.execAt = m.t; inc.steps.push({ f: 'Ejecutar', h: hora, txt: `Sigue alta tras ${cfg.cooldown} s de enfriamiento → réplica api-${m.rep.api}`, ok: true }); }
      m.ok = z <= cfg.z ? m.ok + 1 : 0;
      if (el > 3 && m.ok >= 5) {
        inc.steps.push({ f: 'Verificar', h: hora, txt: `p95 ${Math.round(s.lat)} ms · ${fmt(Math.max(0, z))}σ → verificado ✓`, ok: true });
        const dur = m.t - inc.start;
        m.log = [{ id: inc.id, hora: inc.hora, svc: 'API', det: inc.steps[1].txt.split(' (')[0], acc: inc.to > inc.from ? `Escalado de ${inc.from} a ${inc.to} réplicas` : 'Solo alerta', res: 'Verificado ✓', dur: dur + ' s', tipo: 'scale-out' }, ...m.log];
        m.lastInc = { ...inc, closed: true, dur }; m.inc = null; m.latOpen = false; m.ok = 0; m.calm = 0;
        this.toast('ok', 'Incidente cerrado', `Latencia normal tras ${dur} s`);
      }
    } else {
      m.calm = m.spike === 0 && z < 1.5 ? m.calm + 1 : 0;
      if (cfg.scaleIn && m.calm >= cfg.calma && m.rep.api > mn) {
        const from = m.rep.api; m.rep.api -= 1; m.calm = 0;
        m.log = [{ id: Date.now(), hora, svc: 'API', det: `Carga baja sostenida (${cfg.calma} s)`, acc: `Escalado de ${from} a ${m.rep.api} réplicas`, res: 'Verificado ✓', dur: '6 s', tipo: 'scale-in' }, ...m.log];
      }
    }
    this.setState({ mon: m });
  }
  renderVals() {
    if (typeof window !== 'undefined') window.__fitiaCtlInst = this;
    const s = this.state; const m = s.mon; const cfg = s.cfg;
    const open = (m.latOpen ? 1 : 0) + (m.errOpen ? 1 : 0);
    const last = m.lat[m.lat.length - 1] || { v: 0 };
    const p95 = Math.round([...m.lat.slice(-20)].map(x => x.v).sort((a, b) => a - b)[18] || last.v);
    const ctl = {
      route: s.route, go: this.go, toast: this.toast, cfg, clock: clk(m.t), t: m.t,
      setCfg: p => this.setState(st => ({ cfg: { ...st.cfg, ...p } })),
      simulate: this.simulate, login: () => { this.setState({ authed: true }); this.go('resumen'); },
      mon: { ...m, open, p95, anomalies: [m.latOpen && { svc: 'API', metric: 'Latencia p95', z: m.z }, m.errOpen && { svc: 'API', metric: 'Tasa de error', z: m.ze }].filter(Boolean) }
    };
    const r = {}; ROUTES.forEach(k => { r[k] = s.route === k; });
    const narrow = typeof window !== 'undefined' && window.innerWidth < 1500;
    return {
      ctl, r, isLogin: s.route === 'login', isApp: s.route !== 'login', winTitle: TITLES[s.route],
      sideW: narrow ? '208px' : '232px', mainPad: narrow ? '18px 20px 28px' : '24px 32px 40px',
      nav: NAV.map(([id, label]) => { const on = s.route === id; return { label, icon: IC[id], cur: on, bg: on ? '#1A1A1D' : 'transparent', fg: on ? '#F2F0EB' : '#9A9AA0', fw: on ? 700 : 600, bar: on ? '#D4FF00' : 'transparent', live: id === 'monitoreo', liveC: open ? '#FF4D1A' : '#3DDC84', go: () => this.go(id) }; }),
      stTxt: open ? `${open} ${open === 1 ? 'anomalía abierta' : 'anomalías abiertas'}` : 'Todos los sistemas operativos',
      stBg: open ? 'rgba(255,77,26,.12)' : 'rgba(61,220,132,.1)', stBd: open ? '#FF4D1A' : '#3DDC84', stFg: open ? '#FF4D1A' : '#3DDC84', stDot: open ? '#FF4D1A' : '#3DDC84',
      provider: cfg.provider, apiRep: m.rep.api, apiP95: p95, clock: clk(m.t),
      goMon: () => this.go('monitoreo'), logout: () => this.go('login'),
      toasts: s.toasts
    };
  }
}
</script>
</body>
</html>
