<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Arial, Helvetica, sans-serif">
  <title>FitIA — Despliegue con Docker Compose</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1400" height="780" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#111">FitIA — Despliegue con Docker Compose (docker compose up)</text>
  <text x="40" y="70" font-size="15" fill="#444">Un solo comando levanta los 4 contenedores en el PC del equipo. Nginx es la única puerta de entrada.</text>

  <!-- Clientes -->
  <text x="40" y="122" font-size="14" font-weight="bold" fill="#1F4E79" letter-spacing="1">CLIENTES</text>
  <rect x="40" y="138" width="220" height="74" rx="8" fill="#F7F7F7" stroke="#222" stroke-width="1.5"/>
  <text x="56" y="168" font-size="16" font-weight="bold" fill="#111">Navegador</text>
  <text x="56" y="192" font-size="14" fill="#333">Web (React)</text>

  <rect x="40" y="248" width="220" height="74" rx="8" fill="#F7F7F7" stroke="#222" stroke-width="1.5"/>
  <text x="56" y="278" font-size="16" font-weight="bold" fill="#111">Celular</text>
  <text x="56" y="302" font-size="14" fill="#333">Expo Go o APK, misma WiFi</text>

  <rect x="40" y="358" width="220" height="74" rx="8" fill="#F7F7F7" stroke="#222" stroke-width="1.5"/>
  <text x="56" y="388" font-size="16" font-weight="bold" fill="#111">FitIA Control (.exe)</text>
  <text x="56" y="412" font-size="14" fill="#333">Admin y entrenadores</text>

  <rect x="40" y="590" width="220" height="74" rx="8" fill="#F7F7F7" stroke="#222" stroke-width="1.5"/>
  <text x="56" y="620" font-size="16" font-weight="bold" fill="#111">MySQL Workbench</text>
  <text x="56" y="644" font-size="14" fill="#333">Clase de Bases de Datos</text>

  <!-- PC / Docker -->
  <rect x="330" y="100" width="790" height="640" rx="10" fill="#EEF4FA" stroke="#1F4E79" stroke-width="2"/>
  <text x="350" y="128" font-size="15" font-weight="bold" fill="#1F4E79" letter-spacing="1">PC DEL EQUIPO · DOCKER DESKTOP · RED INTERNA DE COMPOSE</text>

  <!-- web / nginx -->
  <rect x="360" y="150" width="300" height="290" rx="8" fill="#FFFFFF" stroke="#222" stroke-width="1.5"/>
  <text x="378" y="180" font-size="17" font-weight="bold" fill="#111">web · Nginx 1.27</text>
  <text x="378" y="204" font-size="14" fill="#333">Proxy inverso y archivos de la web</text>
  <rect x="378" y="222" width="264" height="52" rx="6" fill="#DCEBD6" stroke="#2E7D32"/>
  <text x="392" y="244" font-size="14" font-weight="bold" fill="#1B5E20">:8080 → web compilada</text>
  <text x="392" y="264" font-size="13" fill="#1B5E20">y /api/ reenviado a la API</text>
  <rect x="378" y="286" width="264" height="52" rx="6" fill="#DCEBD6" stroke="#2E7D32"/>
  <text x="392" y="308" font-size="14" font-weight="bold" fill="#1B5E20">:5000 → solo la API</text>
  <text x="392" y="328" font-size="13" fill="#1B5E20">para el celular y el .exe</text>
  <text x="378" y="366" font-size="13" fill="#333">Cabeceras: Content-Security-Policy,</text>
  <text x="378" y="386" font-size="13" fill="#333">X-Frame-Options, nosniff, Referrer-Policy</text>
  <text x="378" y="412" font-size="13" fill="#333">Agrega X-Forwarded-For (IP real)</text>

  <!-- api -->
  <rect x="780" y="150" width="310" height="200" rx="8" fill="#FFFFFF" stroke="#222" stroke-width="1.5"/>
  <text x="798" y="180" font-size="17" font-weight="bold" fill="#111">api · Flask + Gunicorn</text>
  <text x="798" y="206" font-size="14" fill="#333">REST /api/v1 · JWT · rate-limit</text>
  <text x="798" y="230" font-size="14" fill="#333">Validador de 7 reglas · IA Strategy</text>
  <text x="798" y="254" font-size="14" fill="#333">Middleware de métricas</text>
  <text x="798" y="286" font-size="13" fill="#7A3E00">Sin puertos publicados</text>
  <text x="798" y="306" font-size="13" fill="#7A3E00">PROXY_SALTOS=1 (confía en Nginx)</text>
  <text x="798" y="330" font-size="13" fill="#333">Imagen: python:3.13-slim</text>

  <!-- worker -->
  <rect x="780" y="380" width="310" height="110" rx="8" fill="#FFFFFF" stroke="#222" stroke-width="1.5"/>
  <text x="798" y="410" font-size="17" font-weight="bold" fill="#111">worker · MAPE-K</text>
  <text x="798" y="436" font-size="14" fill="#333">Monitorear → Analizar → Planificar</text>
  <text x="798" y="458" font-size="14" fill="#333">→ Ejecutar (simulado), cada 15 s</text>
  <text x="798" y="478" font-size="13" fill="#333">Misma imagen que la API</text>

  <!-- db -->
  <path d="M560,560 a150,22 0 0,0 300,0 v120 a150,22 0 0,1 -300,0 z" fill="#FFFFFF" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="710" cy="560" rx="150" ry="22" fill="#F7F7F7" stroke="#222" stroke-width="1.5"/>
  <text x="710" y="610" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">db · MySQL 8</text>
  <text x="710" y="634" font-size="14" fill="#333" text-anchor="middle">schema + seed + roles al crear</text>
  <text x="710" y="656" font-size="14" fill="#333" text-anchor="middle">volumen fitia_datos</text>
  <text x="710" y="678" font-size="13" fill="#333" text-anchor="middle">:3306 interno · :3307 en el PC</text>

  <!-- Gemini -->
  <rect x="1170" y="170" width="200" height="100" rx="40" fill="#FFFFFF" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1270" y="208" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">Google Gemini</text>
  <text x="1270" y="232" font-size="13" fill="#333" text-anchor="middle">capa gratuita · opcional</text>
  <text x="1270" y="252" font-size="13" fill="#333" text-anchor="middle">(si falla → Mock)</text>

  <!-- Flechas -->
  <line x1="260" y1="175" x2="374" y2="246" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <text x="263" y="232" font-size="12" fill="#222">HTTP :8080</text>
  <line x1="260" y1="285" x2="374" y2="310" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <line x1="260" y1="395" x2="374" y2="320" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <text x="44" y="454" font-size="12" fill="#222">↑ HTTP :5000 · REST/JSON (celular y .exe)</text>

  <line x1="660" y1="250" x2="776" y2="250" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <text x="672" y="238" font-size="12" fill="#222">proxy_pass</text>
  <text x="672" y="270" font-size="12" fill="#222">api:5000</text>

  <path d="M780,330 H740 V534" fill="none" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <text x="734" y="470" font-size="12" fill="#222" text-anchor="end">SQL · fitia_app</text>
  <text x="734" y="486" font-size="12" fill="#222" text-anchor="end">(rol_api)</text>
  <line x1="935" y1="490" x2="850" y2="546" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <text x="900" y="550" font-size="12" fill="#222">lee métricas,</text>
  <text x="900" y="566" font-size="12" fill="#222">escribe anomalías</text>

  <line x1="1090" y1="220" x2="1166" y2="220" stroke="#222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="1096" y="208" font-size="12" fill="#222">HTTPS</text>

  <line x1="260" y1="627" x2="556" y2="620" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <text x="44" y="580" font-size="12" fill="#222">↓ TCP :3307 (root) hacia db</text>
</svg>
