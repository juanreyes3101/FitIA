# Nginx como proxy inverso: es la única puerta de entrada.
#   puerto 80   → la web compilada + /api/ reenviado a la API Flask
#   puerto 5000 → solo la API (app móvil y FitIA Control); la API no publica puertos propios

upstream fitia_api {
    server api:5000;
}

server {
    listen 5000;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    location / {
        proxy_pass http://fitia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP: solo scripts propios (mitiga XSS, que es lo que podría robar el refresh token de localStorage).
    # Estilos en línea por Recharts; fuentes de Google Fonts; la API en el mismo origen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    client_max_body_size 2m;
    server_tokens off;

    location /api/ {
        proxy_pass http://fitia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # la IA puede tardar unos segundos
    }

    # Archivos con hash: caché larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Single Page App: cualquier otra ruta la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
